# Which workstation listeners CustomCrafting registers with the server.
#
# One switch per listener. Turning one off means that recipe type simply does nothing: the recipes
# still load and still appear in /recipes status, but no event is handled for that workstation, so
# nothing is evaluated and nothing is consumed.
#
# Everything defaults to true - the behaviour CustomCrafting has always had. Only turn something off
# if you are sure you do not use that workstation.
#
# Why bother: SIX of these listeners hook InventoryClickEvent, which fires for EVERY inventory click
# on the server (any chest, any menu), and TWO hook PlayerInteractEvent, which fires for EVERY right
# click. Each filters out quickly, but there is no reason to pay for a workstation you never use.

# Crafting table recipes (type: crafting).
# Hooks InventoryClickEvent + PrepareItemCraftEvent.
craftingTable = true

# The 1.21 Crafter block (type: crafting).
# Hooks CrafterCraftEvent + InventoryClickEvent.
crafter = true

# Furnace, blast furnace and smoker (type: cooking).
# Hooks FurnaceStartSmeltEvent, FurnaceSmeltEvent and BlockExpEvent.
furnace = true

# Campfire cooking (type: cooking).
# Hooks CampfireStartEvent, PlayerInteractEvent and BlockCookEvent.
campfire = true

# Anvil recipes (type: repairing).
# Hooks PrepareAnvilEvent + InventoryClickEvent.
anvil = true

# Smithing table recipes (type: smithing).
# Hooks PrepareSmithingEvent + SmithItemEvent.
smithingTable = true

# Grindstone recipes (type: grinding).
# Hooks PrepareGrindstoneEvent + two InventoryClickEvent handlers.
grindstone = true

# Stonecutter recipes (type: stonecutting).
# Hooks PlayerStonecutterRecipeSelectEvent + InventoryClickEvent.
# PAPER ONLY - this listener does not exist on plain Spigot, where the setting is ignored.
stonecutter = true

# Cauldron recipes (type: mixing).
# Hooks PlayerInteractEvent.
# NOTE: the cauldron feature is NOT IMPLEMENTED yet - the handler ends in a "TODO: cauldron GUI" and
# does nothing at all. Turning it off costs you nothing today and removes one handler from every
# single right click.
cauldron = true
