# How much of CustomCrafting is exposed to the VANILLA recipe system and the recipe book.
#
# CustomCrafting registers a "placeholder" recipe with the server for most custom recipes.
# Those placeholders are NOT just cosmetics for the recipe book - for some workstations vanilla
# has to match a recipe before CustomCrafting ever receives an event.

# Push the recipe book to players whenever the recipe set changes.
#
# Set this to false if nobody on your server uses the vanilla recipe book. The server still
# registers and matches every recipe exactly as before; it simply stops sending the recipe-book
# update packet, which carries the WHOLE book to EVERY online player and is by far the most
# expensive part of startup and of /cc reload.
#
# Cost of disabling: custom recipes will not appear in players' recipe books, and the book will not
# refresh after a reload until the player rejoins. Crafting itself is unaffected.
syncToPlayers = true

# Register the placeholder recipes with the server at all.
#
# !! Only set this to false if you understand the consequences. !!
# Disabling it skips all platform recipe registration - the cheapest possible option - but:
#
#   * Custom COOKING recipes (furnace, blast furnace, smoker) STOP WORKING. Vanilla decides whether
#     an input is smeltable; with no placeholder it never starts the burn, so CustomCrafting never
#     gets FurnaceStartSmeltEvent.
#   * Custom STONECUTTING recipes STOP WORKING. The stonecutter's option list is vanilla's, and
#     CustomCrafting resolves the selected option back through the placeholder key.
#   * Crafting-table and smithing recipes keep working (CustomCrafting drives those itself), but
#     clients may flicker, because the client no longer predicts a result for the grid it sees.
#
#   * SPIGOT/PAPER ONLY. On Fabric this option is IGNORED (with a warning in the log): there the
#     proxy recipes are how custom recipes enter the vanilla recipe map at all, so skipping them
#     would disable custom recipes far more broadly.
#
# If you only want to get rid of the recipe book, use syncToPlayers = false instead.
registerPlaceholders = true
